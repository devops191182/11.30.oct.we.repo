AWSTemplateFormatVersion: '2010-09-09'
Description: Create IAM Role

Resources:
  MyIAMRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: Newrole-12pm
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
            Action:
              - sts:AssumeRole

      Policies:
        - PolicyName: S3Policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                  - ec2:Describe*
                  - iam:*
                Resource:
                  - '*'

Outputs:
  RoleArn:
    Description: ARN of the IAM Role
    Value: !GetAtt MyIAMRole.Arn